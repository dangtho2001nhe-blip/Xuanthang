<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Game Cyberpunk</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: #0a0a16; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        
        .card { 
            background: rgba(22, 33, 62, 0.95); 
            padding: 15px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 0 20px rgba(0, 255, 245, 0.2);
            border: 1px solid rgba(0, 255, 245, 0.3);
            position: relative;
        }

        h2 { color: #00fff5; margin: 0 0 10px 0; font-size: 20px; text-transform: uppercase; text-shadow: 0 0 8px rgba(0,255,245,0.6); }
        
        /* Navigation Tabs */
        .nav-bar { display: flex; gap: 5px; margin-bottom: 15px; background: #0f172a; padding: 5px; border-radius: 12px; }
        .nav-btn { flex: 1; padding: 8px 2px; background: none; border: none; color: #8a8a8a; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .nav-btn.active { background: #00fff5; color: #0a0a16; box-shadow: 0 0 10px rgba(0, 255, 245, 0.5); }

        /* General Inputs & Buttons */
        .input-group { margin-bottom: 10px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: #a29bfe; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1f4068; background: #0f172a; color: #fff; outline: none; }
        
        button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(45deg, #00fff5, #00a8ff); color: #0a0a16; }
        .btn-success { background: #00b894; color: #fff; }
        .btn-danger { background: #e94560; color: #fff; }
        .btn-warning { background: #fdcb6e; color: #2d3436; }
        button:disabled { background: #34495e !important; color: #7f8c8d !important; cursor: not-allowed; }

        .hidden { display: none !important; }
        .money-box { font-size: 16px; font-weight: bold; color: #f1c40f; margin-bottom: 8px; }

        /* Canvas Game & Overlay Menu */
        .canvas-container { position: relative; width: 100%; height: 200px; margin-bottom: 8px; }
        canvas { background: #050b14; border-radius: 12px; border: 2px solid #00fff5; width: 100%; height: 100%; display: block; }
        
        .game-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.85); border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10;
        }

        /* D-Pad Controls */
        .controls-container { display: flex; justify-content: space-between; align-items: center; }
        .dpad { display: grid; grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(3, 38px); gap: 3px; }
        .dpad-btn { background: #0f3460; border: 1px solid #00fff5; color: #fff; font-size: 14px; border-radius: 6px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 3; }
        .action-btns { width: 55%; display: flex; flex-direction: column; gap: 4px; }

        /* Item Cards (Shop & Balo) */
        .item-card { background: #0f172a; border: 1px solid #1f4068; padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item-info { text-align: left; }
        .item-title { font-weight: bold; color: #00fff5; font-size: 14px; }
        .item-desc { font-size: 11px; color: #aaa; }

        /* Chat Box */
        .chat-box { background: #0f172a; border: 1px solid #1f4068; height: 180px; border-radius: 10px; padding: 8px; overflow-y: auto; text-align: left; font-size: 12px; margin-bottom: 8px; }
        .chat-msg { margin-bottom: 5px; word-break: break-all; }
        .chat-user { color: #00fff5; font-weight: bold; }
    </style>
</head>
<body>

    <!-- AUTH PANEL -->
    <div id="auth-panel" class="card">
        <h2>CYBER WORLD</h2>
        <div class="input-group">
            <label>Tài Khoản</label>
            <input type="text" id="username" placeholder="Nhập tên...">
        </div>
        <div class="input-group">
            <label>Mật Khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>
        <button class="btn-primary" onclick="handleAuth('login')">ĐĂNG NHẬP</button>
        <button class="btn-success" onclick="handleAuth('register')">ĐĂNG KÝ</button>
        <p id="status" style="font-size: 12px; color: #ff4757;"></p>
    </div>

    <!-- MAIN GAME PANEL -->
    <div id="game-panel" class="card hidden">
        <div class="money-box">👤 <span id="user-display">Player</span> | 💰 <span id="money-display">0</span> Xu</div>
        
        <!-- NAV BAR -->
        <div class="nav-bar">
            <button class="nav-btn active" onclick="switchPage('play')">PLAY</button>
            <button class="nav-btn" onclick="switchPage('shop')">SHOP</button>
            <button class="nav-btn" onclick="switchPage('balo')">BALO</button>
            <button class="nav-btn" onclick="switchPage('pvp')">PVP</button>
            <button class="nav-btn" onclick="switchPage('chat')">CHAT</button>
        </div>

        <!-- 1. PLAY TAB -->
        <div id="tab-play" class="page-tab">
            <div class="canvas-container">
                <canvas id="gameCanvas" width="360" height="200"></canvas>
                
                <!-- MENU CHỜ / GAME OVER OVERLAY -->
                <div id="menu-overlay" class="game-overlay">
                    <h3 id="overlay-title" style="color: #00fff5; margin-bottom: 10px;">SẢNH CHỜ</h3>
                    <button class="btn-primary" style="width: 150px;" onclick="startGameSession()">▶️ BẮT ĐẦU CHƠI</button>
                </div>
            </div>

            <div class="controls-container">
                <div class="dpad">
                    <div class="dpad-btn dpad-up" ontouchstart="startMove('up')" ontouchend="stopMove('up')" onmousedown="startMove('up')" onmouseup="stopMove('up')">▲</div>
                    <div class="dpad-btn dpad-left" ontouchstart="startMove('left')" ontouchend="stopMove('left')" onmousedown="startMove('left')" onmouseup="stopMove('left')">◀</div>
                    <div class="dpad-btn dpad-right" ontouchstart="startMove('right')" ontouchend="stopMove('right')" onmousedown="startMove('right')" onmouseup="stopMove('right')">▶</div>
                    <div class="dpad-btn dpad-down" ontouchstart="startMove('down')" ontouchend="stopMove('down')" onmousedown="startMove('down')" onmouseup="stopMove('down')">▼</div>
                </div>
                <div class="action-btns">
                    <button id="skillBtn" class="btn-primary" onclick="useActiveSkill()" disabled>🔒 Không Có Skill</button>
                    <button class="btn-danger" onclick="stopGameSession('SẢNH CHỜ')" style="padding: 5px;">⏸️ Tạm Dừng / Menu</button>
                    <button class="btn-danger" onclick="logout()" style="padding: 5px;">Thoát Game</button>
                </div>
            </div>
        </div>

        <!-- 2. SHOP TAB -->
        <div id="tab-shop" class="page-tab hidden">
            <div class="item-card">
                <div class="item-info">
                    <div class="item-title">👻 Con Ma</div>
                    <div class="item-desc">Skill: Bất tử 5s (Hồi 15s)</div>
                </div>
                <button id="buy-ghost-btn" class="btn-warning" style="width: 100px;" onclick="buyItem('ghost', 50)">50 Xu</button>
            </div>
            <div class="item-card">
                <div class="item-info">
                    <div class="item-title">👾 Alien</div>
                    <div class="item-desc">Skill: Vòng Năng Lượng 20s</div>
                </div>
                <button id="buy-alien-btn" class="btn-warning" style="width: 100px;" onclick="buyItem('alien', 80)">80 Xu</button>
            </div>
            <div class="item-card">
                <div class="item-info">
                    <div class="item-title">🐱 Mèo</div>
                    <div class="item-desc">Skill: Cào Chết NPC Gần</div>
                </div>
                <button id="buy-cat-btn" class="btn-warning" style="width: 100px;" onclick="buyItem('cat', 123)">123 Xu</button>
            </div>
        </div>

        <!-- 3. BALO TAB -->
        <div id="tab-balo" class="page-tab hidden">
            <div id="inventory-list"></div>
        </div>

        <!-- 4. PVP TAB -->
        <div id="tab-pvp" class="page-tab hidden">
            <p style="font-size: 13px; color: #aaa;">Đang tìm đối thủ trong khu vực...</p>
            <div class="item-card">
                <div class="item-info">
                    <div class="item-title">⚔️ Đấu Trường 1v1</div>
                    <div class="item-desc">Thách đấu ngẫu nhiên</div>
                </div>
                <button class="btn-danger" style="width: 100px;" onclick="startPVP()">CHẾT BỎ</button>
            </div>
            <p id="pvp-result" style="font-weight: bold; color: #00fff5; margin-top: 15px;"></p>
        </div>

        <!-- 5. CHAT TAB -->
        <div id="tab-chat" class="page-tab hidden">
            <div class="chat-box" id="chat-messages">
                <div class="chat-msg"><span class="chat-user">Hệ Thống:</span> Chào mừng tới phòng chat thế giới!</div>
            </div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="chat-input" placeholder="Nhập tin nhắn...">
                <button class="btn-primary" style="width: 80px; margin: 0;" onclick="sendChat()">GỬI</button>
            </div>
        </div>

    </div>

    <script>
        let currentAccount = null;
        let userData = { money: 0, inventory: ['human'], equipped: 'human' };

        // --- AUTH ---
        function handleAuth(type) {
            let u = document.getElementById('username').value.trim();
            let p = document.getElementById('password').value.trim();
            let st = document.getElementById('status');
            if(!u || !p) return st.innerText = "Chưa nhập thông tin!";

            if(type === 'register') {
                if(localStorage.getItem('acc_' + u)) return st.innerText = "Tài khoản đã tồn tại!";
                let newData = { pass: p, money: 0, inventory: ['human'], equipped: 'human' };
                localStorage.setItem('acc_' + u, JSON.stringify(newData));
                st.style.color = '#2ed573'; st.innerText = "Đăng ký thành công! Hãy bấm Đăng Nhập.";
            } else {
                let data = localStorage.getItem('acc_' + u);
                if(!data) return st.innerText = "Tài khoản không tồn tại!";
                let parsed = JSON.parse(data);
                if(parsed.pass !== p) return st.innerText = "Sai mật khẩu!";
                
                currentAccount = u;
                userData = parsed;
                document.getElementById('auth-panel').classList.add('hidden');
                document.getElementById('game-panel').classList.remove('hidden');
                document.getElementById('user-display').innerText = u;
                updateUI();
                initGameEngine();
            }
        }

        function saveData() {
            if(currentAccount) localStorage.setItem('acc_' + currentAccount, JSON.stringify(userData));
        }

        function updateUI() {
            document.getElementById('money-display').innerText = userData.money;
            updateShopUI();
            updateBaloUI();
            updateSkillButton();
        }

        // --- NAVIGATION ---
        function switchPage(page) {
            document.querySelectorAll('.page-tab').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + page).classList.remove('hidden');
            event.target.classList.add('active');
            
            if(page !== 'play') stopGameSession('SẢNH CHỜ');
        }

        // --- SHOP & BALO ---
        function buyItem(item, price) {
            if(userData.inventory.includes(item)) return alert("Bạn đã có nhân vật này!");
            if(userData.money < price) return alert("Không đủ xu!");
            
            userData.money -= price;
            userData.inventory.push(item);
            saveData();
            updateUI();
            alert("Mua thành công!");
        }

        function updateShopUI() {
            let bGhost = document.getElementById('buy-ghost-btn');
            let bAlien = document.getElementById('buy-alien-btn');
            let bCat = document.getElementById('buy-cat-btn');
            
            if(userData.inventory.includes('ghost')) { bGhost.innerText = "Đã Có"; bGhost.disabled = true; }
            if(userData.inventory.includes('alien')) { bAlien.innerText = "Đã Có"; bAlien.disabled = true; }
            if(userData.inventory.includes('cat')) { bCat.innerText = "Đã Có"; bCat.disabled = true; }
        }

        function updateBaloUI() {
            let list = document.getElementById('inventory-list');
            list.innerHTML = "";
            
            const names = { 
                human: "🧍 Người Bình Thường", 
                ghost: "👻 Con Ma (Bất Tử)", 
                alien: "👾 Alien (Vòng Năng Lượng)",
                cat: "🐱 Mèo (Cào Cận Chiến)"
            };

            userData.inventory.forEach(item => {
                let isEquipped = userData.equipped === item;
                list.innerHTML += `
                    <div class="item-card">
                        <div class="item-info">
                            <div class="item-title">${names[item]}</div>
                            <div class="item-desc">${isEquipped ? '🟢 Đang Trang Bị' : '⚪ Trong Balo'}</div>
                        </div>
                        <button class="${isEquipped ? 'btn-success' : 'btn-primary'}" style="width: 100px;" ${isEquipped ? 'disabled' : ''} onclick="equipItem('${item}')">
                            ${isEquipped ? 'ĐANG DÙNG' : 'TRANG BỊ'}
                        </button>
                    </div>`;
            });
        }

        function equipItem(item) {
            userData.equipped = item;
            saveData();
            updateUI();
        }

        // --- SKILL CONTROL ---
        let skillCD = false;
        function updateSkillButton() {
            let btn = document.getElementById('skillBtn');
            if(!isGamePlaying) {
                btn.innerText = "🔒 Bấm Play Để Dùng";
                btn.disabled = true;
                return;
            }

            if(userData.equipped === 'human') {
                btn.innerText = "🔒 Không Có Skill";
                btn.disabled = true;
            } else if(userData.equipped === 'ghost') {
                btn.innerText = "👻 Bất Tử (15s)";
                btn.disabled = skillCD;
            } else if(userData.equipped === 'alien') {
                btn.innerText = "👾 Vòng Tròn (36s)";
                btn.disabled = skillCD;
            } else if(userData.equipped === 'cat') {
                btn.innerText = "🐱 Cào NPC (8s)";
                btn.disabled = skillCD;
            }
        }

        function useActiveSkill() {
            if(skillCD || !isGamePlaying) return;

            if(userData.equipped === 'ghost') {
                ghostInvincible.active = true;
                setTimeout(() => { ghostInvincible.active = false; }, 5000);
                startCooldown(15);
            } else if(userData.equipped === 'alien') {
                alienShield.active = true;
                setTimeout(() => { alienShield.active = false; }, 20000);
                startCooldown(36);
            } else if(userData.equipped === 'cat') {
                catSlashEffect = 15;
                npcs = npcs.filter(npc => {
                    let dx = player.x - npc.x, dy = player.y - npc.y;
                    return Math.sqrt(dx * dx + dy * dy) > 60;
                });
                startCooldown(8);
            }
        }

        function startCooldown(seconds) {
            skillCD = true;
            let btn = document.getElementById('skillBtn');
            let timer = seconds;
            btn.disabled = true;
            let cd = setInterval(() => {
                timer--;
                if(timer > 0) btn.innerText = `Hồi (${timer}s)`;
                else {
                    clearInterval(cd);
                    skillCD = false;
                    updateSkillButton();
                }
            }, 1000);
        }

        // --- GAME ENGINE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let moveState = { up: false, down: false, left: false, right: false };
        let player = { x: 180, y: 100, radius: 12, speed: 2.5 };
        let alienShield = { active: false, radius: 45 };
        let ghostInvincible = { active: false };
        let catSlashEffect = 0;
        let npcs = [];
        let droppedCoins = [];
        let isGamePlaying = false;
        let coinSpawnTimer = null;

        function startMove(d) { if(isGamePlaying) moveState[d] = true; }
        function stopMove(d) { moveState[d] = false; }

        function startGameSession() {
            isGamePlaying = true;
            player.x = 180; player.y = 100; // Reset vị trí người chơi
            droppedCoins = [];
            ghostInvincible.active = false;
            alienShield.active = false;

            document.getElementById('menu-overlay').classList.add('hidden');
            
            // Spawn 2 - 4 NPC
            npcs = [];
            let count = Math.floor(Math.random() * 3) + 2;
            for(let i = 0; i < count; i++) {
                npcs.push({ x: Math.random() * (canvas.width - 20) + 10, y: Math.random() * (canvas.height - 20) + 10, radius: 8, speed: 0.9 + Math.random() * 0.3 });
            }

            scheduleNextCoin();
            updateSkillButton();
        }

        function stopGameSession(titleText = 'SẢNH CHỜ') {
            isGamePlaying = false;
            let overlay = document.getElementById('menu-overlay');
            let title = document.getElementById('overlay-title');
            title.innerText = titleText;
            overlay.classList.remove('hidden');
            clearTimeout(coinSpawnTimer);
            updateSkillButton();
        }

        function scheduleNextCoin() {
            if(!isGamePlaying) return;
            let time = (Math.floor(Math.random() * 4) + 3) * 1000;
            coinSpawnTimer = setTimeout(() => {
                if(isGamePlaying) {
                    droppedCoins.push({
                        x: Math.random() * (canvas.width - 40) + 20,
                        y: Math.random() * (canvas.height - 40) + 20,
                        value: Math.floor(Math.random() * 26) + 1
                    });
                    scheduleNextCoin();
                }
            }, time);
        }

        function updateGame() {
            if(!isGamePlaying) return;

            // Di chuyển Player
            if (moveState.up && player.y - player.radius > 0) player.y -= player.speed;
            if (moveState.down && player.y + player.radius < canvas.height) player.y += player.speed;
            if (moveState.left && player.x - player.radius > 0) player.x -= player.speed;
            if (moveState.right && player.x + player.radius < canvas.width) player.x += player.speed;

            // Xử lý Ăn Xu
            droppedCoins = droppedCoins.filter(coin => {
                let dx = player.x - coin.x, dy = player.y - coin.y;
                if(Math.sqrt(dx * dx + dy * dy) < player.radius + 10) {
                    userData.money += coin.value;
                    saveData();
                    updateUI();
                    return false;
                }
                return true;
            });

            // Xử lý NPC đuổi theo & Va chạm
            npcs.forEach(npc => {
                let dx = player.x - npc.x, dy = player.y - npc.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                // Nếu bật Skill Alien (Vòng đẩy)
                if (alienShield.active && userData.equipped === 'alien') {
                    if (dist < alienShield.radius + npc.radius) {
                        let angle = Math.atan2(dy, dx);
                        npc.x = player.x - Math.cos(angle) * (alienShield.radius + npc.radius);
                        npc.y = player.y - Math.sin(angle) * (alienShield.radius + npc.radius);
                        return;
                    }
                }

                // KIỂM TRA VA CHẠM / CHẾT
                // Trừ khi đang bật Skill Ma Bất Tử
                if (dist < player.radius + npc.radius) {
                    if (!(ghostInvincible.active && userData.equipped === 'ghost')) {
                        stopGameSession('💀 BẠN ĐÃ CHẾT!');
                        return;
                    }
                }

                if (dist > 0) { npc.x += (dx / dist) * npc.speed; npc.y += (dy / dist) * npc.speed; }
            });
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Vẽ Xu Trên Đất
            droppedCoins.forEach(coin => {
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath(); ctx.arc(coin.x, coin.y, 8, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
                ctx.fillText('+' + coin.value, coin.x, coin.y + 3);
            });

            // 2. Vẽ Vòng Alien
            if (alienShield.active && userData.equipped === 'alien') {
                ctx.beginPath(); ctx.arc(player.x, player.y, alienShield.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 255, 204, 0.25)'; ctx.fill();
                ctx.strokeStyle = '#00ffcc'; ctx.stroke();
            }

            // 3. Hiệu ứng vệt cào Mèo
            if(catSlashEffect > 0) {
                ctx.strokeStyle = '#e94560'; ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(player.x - 30, player.y - 30); ctx.lineTo(player.x + 30, player.y + 30);
                ctx.moveTo(player.x - 20, player.y - 35); ctx.lineTo(player.x + 35, player.y + 20);
                ctx.stroke(); catSlashEffect--;
            }

            // 4. Vẽ Nhân Vật Dùng Emoji / Icon
            ctx.save();
            if (ghostInvincible.active && userData.equipped === 'ghost') ctx.globalAlpha = 0.4;

            ctx.font = '22px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            let icons = { human: '🧍', ghost: '👻', alien: '👾', cat: '🐱' };
            ctx.fillText(icons[userData.equipped] || '🧍', player.x, player.y);
            ctx.restore();

            // 5. Vẽ NPC Địch
            npcs.forEach(npc => {
                ctx.beginPath(); ctx.arc(npc.x, npc.y, npc.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff4757'; ctx.fill();
            });
        }

        let isEngineRunning = false;
        function gameLoop() { updateGame(); drawGame(); requestAnimationFrame(gameLoop); }
        function initGameEngine() { if (!isEngineRunning) { isEngineRunning = true; gameLoop(); } }

        // --- CHAT & PVP ---
        function sendChat() {
            let inp = document.getElementById('chat-input');
            if(!inp.value.trim()) return;
            let box = document.getElementById('chat-messages');
            box.innerHTML += `<div class="chat-msg"><span class="chat-user">${currentAccount}:</span> ${inp.value}</div>`;
            inp.value = "";
            box.scrollTop = box.scrollHeight;
        }

        function startPVP() {
            let res = document.getElementById('pvp-result');
            res.innerText = "⚔️ Đang chiến đấu...";
            setTimeout(() => {
                let win = Math.random() > 0.5;
                if(win) {
                    userData.money += 10; saveData(); updateUI();
                    res.innerText = "🎉 BẠN ĐÃ THẮNG! (+10 Xu)";
                } else {
                    res.innerText = "💀 BẠN ĐÃ THUA!";
                }
            }, 1500);
        }

        function logout() { location.reload(); }
    </script>
