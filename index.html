<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Game Cyberpunk - PvP 2v2</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: #0a0a16; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        
        .card { 
            background: rgba(22, 33, 62, 0.95); 
            padding: 15px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 0 20px rgba(0, 255, 245, 0.2);
            border: 1px solid rgba(0, 255, 245, 0.3);
            position: relative;
        }

        h2 { color: #00fff5; margin: 0 0 10px 0; font-size: 20px; text-transform: uppercase; text-shadow: 0 0 8px rgba(0,255,245,0.6); }
        
        /* Navigation Tabs */
        .nav-bar { display: flex; gap: 5px; margin-bottom: 15px; background: #0f172a; padding: 5px; border-radius: 12px; }
        .nav-btn { flex: 1; padding: 8px 2px; background: none; border: none; color: #8a8a8a; font-size: 11px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .nav-btn.active { background: #00fff5; color: #0a0a16; box-shadow: 0 0 10px rgba(0, 255, 245, 0.5); }

        /* General Inputs & Buttons */
        .input-group { margin-bottom: 10px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: #a29bfe; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1f4068; background: #0f172a; color: #fff; outline: none; }
        
        button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(45deg, #00fff5, #00a8ff); color: #0a0a16; }
        .btn-success { background: #00b894; color: #fff; }
        .btn-danger { background: #e94560; color: #fff; }
        .btn-warning { background: #fdcb6e; color: #2d3436; }
        button:disabled { background: #34495e !important; color: #7f8c8d !important; cursor: not-allowed; }

        .hidden { display: none !important; }
        .money-box { font-size: 15px; font-weight: bold; color: #f1c40f; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        /* Canvas Game & Overlay Menu */
        .canvas-container { position: relative; width: 100%; height: 200px; margin-bottom: 8px; }
        canvas { background: #050b14; border-radius: 12px; border: 2px solid #00fff5; width: 100%; height: 100%; display: block; }
        
        .game-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.9); border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10;
        }

        /* D-Pad Controls */
        .controls-container { display: flex; justify-content: space-between; align-items: center; }
        .dpad { display: grid; grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(3, 38px); gap: 3px; }
        .dpad-btn { background: #0f3460; border: 1px solid #00fff5; color: #fff; font-size: 14px; border-radius: 6px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 3; }
        .action-btns { width: 55%; display: flex; flex-direction: column; gap: 4px; }

        /* Item Cards & Room Cards */
        .item-card { background: #0f172a; border: 1px solid #1f4068; padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item-info { text-align: left; }
        .item-title { font-weight: bold; color: #00fff5; font-size: 13px; }
        .item-desc { font-size: 11px; color: #aaa; }

        /* Chat Box */
        .chat-box { background: #0f172a; border: 1px solid #1f4068; height: 180px; border-radius: 10px; padding: 8px; overflow-y: auto; text-align: left; font-size: 12px; margin-bottom: 8px; }
        .chat-msg { margin-bottom: 5px; word-break: break-all; }
        .chat-user { color: #00fff5; font-weight: bold; }
    </style>
</head>
<body>

    <!-- AUTH PANEL -->
    <div id="auth-panel" class="card">
        <h2>CYBER WORLD</h2>
        <div class="input-group">
            <label>Tài Khoản</label>
            <input type="text" id="username" placeholder="Nhập tên...">
        </div>
        <div class="input-group">
            <label>Mật Khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>
        <button class="btn-primary" onclick="handleAuth('login')">ĐĂNG NHẬP</button>
        <button class="btn-success" onclick="handleAuth('register')">ĐĂNG KÝ</button>
        <p id="status" style="font-size: 12px; color: #ff4757;"></p>
    </div>

    <!-- MAIN GAME PANEL -->
    <div id="game-panel" class="card hidden">
        <div class="money-box">
            <span>👤 <span id="user-display">Player</span> | 💰 <span id="money-display">0</span> Xu</span>
            <button class="btn-danger" style="width: auto; padding: 2px 8px; margin:0; font-size:10px;" onclick="logout()">Đăng Xuất</button>
        </div>
        
        <!-- NAV BAR -->
        <div class="nav-bar">
            <button class="nav-btn active" onclick="switchPage('play')">PLAY</button>
            <button class="nav-btn" onclick="switchPage('shop')">SHOP</button>
            <button class="nav-btn" onclick="switchPage('balo')">BALO</button>
            <button class="nav-btn" onclick="switchPage('pvp')">PVP 2v2</button>
            <button class="nav-btn" onclick="switchPage('chat')">CHAT</button>
        </div>

        <!-- 1. PLAY TAB -->
        <div id="tab-play" class="page-tab">
            <div class="canvas-container">
                <canvas id="gameCanvas" width="360" height="200"></canvas>
                
                <!-- OVERLAY SẢNH CHỜ / PvP READY -->
                <div id="menu-overlay" class="game-overlay">
                    <h3 id="overlay-title" style="color: #00fff5; margin-bottom: 5px;">SẢNH CHỜ</h3>
                    <p id="overlay-sub" style="font-size: 12px; color: #aaa; margin-bottom: 10px;"></p>
                    <button id="start-game-btn" class="btn-primary" style="width: 150px;" onclick="startGameSession()">▶️ BẮT ĐẦU CHƠI</button>
                </div>
            </div>

            <div class="controls-container">
                <div class="dpad">
                    <div class="dpad-btn dpad-up" ontouchstart="startMove('up')" ontouchend="stopMove('up')" onmousedown="startMove('up')" onmouseup="stopMove('up')">▲</div>
                    <div class="dpad-btn dpad-left" ontouchstart="startMove('left')" ontouchend="stopMove('left')" onmousedown="startMove('left')" onmouseup="stopMove('left')">◀</div>
                    <div class="dpad-btn dpad-right" ontouchstart="startMove('right')" ontouchend="stopMove('right')" onmousedown="startMove('right')" onmouseup="stopMove('right')">▶</div>
                    <div class="dpad-btn dpad-down" ontouchstart="startMove('down')" ontouchend="stopMove('down')" onmousedown="startMove('down')" onmouseup="stopMove('down')">▼</div>
                </div>
                <div class="action-btns">
                    <button id="skillBtn" class="btn-primary" onclick="useActiveSkill()" disabled>🔒 Không Có Skill</button>
                    <button class="btn-danger" onclick="stopGameSession('SẢNH CHỜ')" style="padding: 5px;">⏸️ Tạm Dừng / Menu</button>
                </div>
            </div>
        </div>

        <!-- 2. SHOP TAB -->
        <div id="tab-shop" class="page-tab hidden">
            <div class="item-card">
                <div class="item-info">
                    <div class="item-title">👻 Con Ma</div>
                    <div class="item-desc">Skill: Bất tử 5s (Hồi 15s)</div>
                </div>
                <button id="buy-ghost-btn" class="btn-warning" style="width: 90px;" onclick="buyItem('ghost', 50)">50 Xu</button>
            </div>
            <div class="item-card">
                <div class="item-info">
                    <div class="item-title">👾 Alien</div>
                    <div class="item-desc">Skill: Vòng Năng Lượng 20s</div>
                </div>
                <button id="buy-alien-btn" class="btn-warning" style="width: 90px;" onclick="buyItem('alien', 80)">80 Xu</button>
            </div>
            <div class="item-card">
                <div class="item-info">
                    <div class="item-title">🐱 Mèo</div>
                    <div class="item-desc">Skill: Cào Chết NPC Gần</div>
                </div>
                <button id="buy-cat-btn" class="btn-warning" style="width: 90px;" onclick="buyItem('cat', 123)">123 Xu</button>
            </div>
        </div>

        <!-- 3. BALO TAB -->
        <div id="tab-balo" class="page-tab hidden">
            <div id="inventory-list"></div>
        </div>

        <!-- 4. PVP 2v2 TAB -->
        <div id="tab-pvp" class="page-tab hidden">
            <button class="btn-success" style="margin-bottom: 10px;" onclick="createPvPRoom()">➕ Tạo Phòng 2v2 Mới</button>
            <div style="font-size: 12px; color: #00fff5; text-align: left; margin-bottom: 5px;">🌐 Danh Sách Phòng Công Khai:</div>
            <div id="pvp-room-list" style="max-height: 180px; overflow-y: auto;"></div>
        </div>

        <!-- 5. CHAT TAB -->
        <div id="tab-chat" class="page-tab hidden">
            <div class="chat-box" id="chat-messages">
                <div class="chat-msg"><span class="chat-user">Hệ Thống:</span> Chào mừng tới phòng chat thế giới!</div>
            </div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="chat-input" placeholder="Nhập tin nhắn...">
                <button class="btn-primary" style="width: 80px; margin: 0;" onclick="sendChat()">GỬI</button>
            </div>
        </div>

    </div>

    <script>
        let currentAccount = null;
        let userData = { money: 0, inventory: ['human'], equipped: 'human' };

        // --- TỰ ĐỘNG ĐĂNG NHẬP KHI MỞ LẠI WEB ---
        window.onload = function() {
            let savedAccount = localStorage.getItem('last_logged_user');
            if(savedAccount) {
                let data = localStorage.getItem('acc_' + savedAccount);
                if(data) {
                    currentAccount = savedAccount;
                    userData = JSON.parse(data);
                    document.getElementById('auth-panel').classList.add('hidden');
                    document.getElementById('game-panel').classList.remove('hidden');
                    document.getElementById('user-display').innerText = savedAccount;
                    updateUI();
                    initGameEngine();
                }
            }
        };

        // --- AUTH ---
        function handleAuth(type) {
            let u = document.getElementById('username').value.trim();
            let p = document.getElementById('password').value.trim();
            let st = document.getElementById('status');
            if(!u || !p) return st.innerText = "Chưa nhập thông tin!";

            if(type === 'register') {
                if(localStorage.getItem('acc_' + u)) return st.innerText = "Tài khoản đã tồn tại!";
                let newData = { pass: p, money: 0, inventory: ['human'], equipped: 'human' };
                localStorage.setItem('acc_' + u, JSON.stringify(newData));
                st.style.color = '#2ed573'; st.innerText = "Đăng ký thành công!";
            } else {
                let data = localStorage.getItem('acc_' + u);
                if(!data) return st.innerText = "Tài khoản không tồn tại!";
                let parsed = JSON.parse(data);
                if(parsed.pass !== p) return st.innerText = "Sai mật khẩu!";
                
                currentAccount = u;
                userData = parsed;
                localStorage.setItem('last_logged_user', u); // Lưu tự động đăng nhập

                document.getElementById('auth-panel').classList.add('hidden');
                document.getElementById('game-panel').classList.remove('hidden');
                document.getElementById('user-display').innerText = u;
                updateUI();
                initGameEngine();
            }
        }

        function logout() {
            localStorage.removeItem('last_logged_user');
            location.reload();
        }

        function saveData() {
            if(currentAccount) localStorage.setItem('acc_' + currentAccount, JSON.stringify(userData));
        }

        function updateUI() {
            document.getElementById('money-display').innerText = userData.money;
            updateShopUI();
            updateBaloUI();
            updateSkillButton();
            renderPvPRooms();
        }

        // --- NAVIGATION ---
        function switchPage(page) {
            document.querySelectorAll('.page-tab').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + page).classList.remove('hidden');
            event.target.classList.add('active');
            
            if(page !== 'play') stopGameSession('SẢNH CHỜ');
        }

        // --- SHOP & BALO ---
        function buyItem(item, price) {
            if(userData.inventory.includes(item)) return alert("Bạn đã có nhân vật này!");
            if(userData.money < price) return alert("Không đủ xu!");
            
            userData.money -= price;
            userData.inventory.push(item);
            saveData();
            updateUI();
            alert("Mua thành công!");
        }

        function updateShopUI() {
            let bGhost = document.getElementById('buy-ghost-btn');
            let bAlien = document.getElementById('buy-alien-btn');
            let bCat = document.getElementById('buy-cat-btn');
            
            if(userData.inventory.includes('ghost')) { bGhost.innerText = "Đã Có"; bGhost.disabled = true; }
            if(userData.inventory.includes('alien')) { bAlien.innerText = "Đã Có"; bAlien.disabled = true; }
            if(userData.inventory.includes('cat')) { bCat.innerText = "Đã Có"; bCat.disabled = true; }
        }

        function updateBaloUI() {
            let list = document.getElementById('inventory-list');
            list.innerHTML = "";
            const names = { human: "🧍 Người Bình Thường", ghost: "👻 Con Ma (Bất Tử)", alien: "👾 Alien (Vòng Năng Lượng)", cat: "🐱 Mèo (Cào Cận Chiến)" };

            userData.inventory.forEach(item => {
                let isEquipped = userData.equipped === item;
                list.innerHTML += `
                    <div class="item-card">
                        <div class="item-info">
                            <div class="item-title">${names[item]}</div>
                            <div class="item-desc">${isEquipped ? '🟢 Đang Trang Bị' : '⚪ Trong Balo'}</div>
                        </div>
                        <button class="${isEquipped ? 'btn-success' : 'btn-primary'}" style="width: 90px;" ${isEquipped ? 'disabled' : ''} onclick="equipItem('${item}')">
                            ${isEquipped ? 'ĐANG DÙNG' : 'TRANG BỊ'}
                        </button>
                    </div>`;
            });
        }

        function equipItem(item) {
            userData.equipped = item;
            saveData();
            updateUI();
        }

        // --- SKILL CONTROL ---
        let skillCD = false;
        function updateSkillButton() {
            let btn = document.getElementById('skillBtn');
            if(!isGamePlaying) { btn.innerText = "🔒 Bấm Play Để Dùng"; btn.disabled = true; return; }

            if(userData.equipped === 'human') { btn.innerText = "🔒 Không Có Skill"; btn.disabled = true; } 
            else if(userData.equipped === 'ghost') { btn.innerText = "👻 Bất Tử (15s)"; btn.disabled = skillCD; } 
            else if(userData.equipped === 'alien') { btn.innerText = "👾 Vòng Tròn (36s)"; btn.disabled = skillCD; } 
            else if(userData.equipped === 'cat') { btn.innerText = "🐱 Cào NPC (8s)"; btn.disabled = skillCD; }
        }

        function useActiveSkill() {
            if(skillCD || !isGamePlaying) return;

            if(userData.equipped === 'ghost') {
                ghostInvincible.active = true;
                setTimeout(() => { ghostInvincible.active = false; }, 5000);
                startCooldown(15);
            } else if(userData.equipped === 'alien') {
                alienShield.active = true;
                setTimeout(() => { alienShield.active = false; }, 20000);
                startCooldown(36);
            } else if(userData.equipped === 'cat') {
                catSlashEffect = 15;
                npcs = npcs.filter(npc => {
                    let dx = player.x - npc.x, dy = player.y - npc.y;
                    return Math.sqrt(dx * dx + dy * dy) > 60;
                });
                startCooldown(8);
            }
        }

        function startCooldown(seconds) {
            skillCD = true;
            let btn = document.getElementById('skillBtn');
            let timer = seconds;
            btn.disabled = true;
            let cd = setInterval(() => {
                timer--;
                if(timer > 0) btn.innerText = `Hồi (${timer}s)`;
                else { clearInterval(cd); skillCD = false; updateSkillButton(); }
            }, 1000);
        }

        // --- GAME ENGINE & PVP LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let moveState = { up: false, down: false, left: false, right: false };
        
        let player = { x: 180, y: 150, radius: 10, speed: 2.2 };
        let isPVPMode = false;
        
        // 2v2 Players Data
        let pvpTeammate = { x: 140, y: 150, radius: 10, icon: '👾', alive: true };
        let pvpEnemies = [
            { x: 140, y: 30, radius: 10, icon: '🐱', alive: true },
            { x: 180, y: 30, radius: 10, icon: '👻', alive: true }
        ];

        let alienShield = { active: false, radius: 45 };
        let ghostInvincible = { active: false };
        let catSlashEffect = 0;
        let npcs = [];
        let droppedCoins = [];
        let isGamePlaying = false;
        let coinSpawnTimer = null;

        function startMove(d) { if(isGamePlaying) moveState[d] = true; }
        function stopMove(d) { moveState[d] = false; }

        function startGameSession() {
            isPVPMode = false;
            isGamePlaying = true;
            player.x = 180; player.y = 100;
            droppedCoins = [];
            document.getElementById('menu-overlay').classList.add('hidden');
            
            npcs = [];
            let count = Math.floor(Math.random() * 3) + 2;
            for(let i = 0; i < count; i++) {
                npcs.push({ x: Math.random() * (canvas.width - 20) + 10, y: Math.random() * (canvas.height - 20) + 10, radius: 8, speed: 0.9 + Math.random() * 0.3 });
            }
            scheduleNextCoin();
            updateSkillButton();
        }

        function stopGameSession(titleText = 'SẢNH CHỜ', subText = '') {
            isGamePlaying = false;
            let overlay = document.getElementById('menu-overlay');
            document.getElementById('overlay-title').innerText = titleText;
            document.getElementById('overlay-sub').innerText = subText;
            document.getElementById('start-game-btn').classList.remove('hidden');
            overlay.classList.remove('hidden');
            clearTimeout(coinSpawnTimer);
            updateSkillButton();
        }

        // --- ĐẾM NGƯỢC 3S VÀO TRẬN PVP 2v2 ---
        function joinPvPRoom(roomName) {
            switchPage('play');
            let overlay = document.getElementById('menu-overlay');
            let title = document.getElementById('overlay-title');
            let sub = document.getElementById('overlay-sub');
            let btn = document.getElementById('start-game-btn');
            
            btn.classList.add('hidden');
            overlay.classList.remove('hidden');
            
            let count = 3;
            sub.innerText = "Phòng: " + roomName + " (2v2 Arena)";
            title.innerText = "⏱️ CHUẨN BỊ: " + count + "s";

            let timer = setInterval(() => {
                count--;
                if(count > 0) {
                    title.innerText = "⏱️ CHUẨN BỊ: " + count + "s";
                } else {
                    clearInterval(timer);
                    startPvPMatch();
                }
            }, 1000);
        }

        function startPvPMatch() {
            isPVPMode = true;
            isGamePlaying = true;
            document.getElementById('menu-overlay').classList.add('hidden');

            // Reset Đội 2v2
            player.x = 220; player.y = 160;
            pvpTeammate = { x: 140, y: 160, radius: 10, icon: '👾', alive: true };
            pvpEnemies = [
                { x: 140, y: 40, radius: 10, icon: '🐱', alive: true },
                { x: 220, y: 40, radius: 10, icon: '👻', alive: true }
            ];

            // Quái Đuổi Theo Tất Cả
            npcs = [];
            for(let i = 0; i < 4; i++) {
                npcs.push({ x: Math.random() * canvas.width, y: 100, radius: 8, speed: 1.1 });
            }
            updateSkillButton();
        }

        function scheduleNextCoin() {
            if(!isGamePlaying || isPVPMode) return;
            let time = (Math.floor(Math.random() * 4) + 3) * 1000;
            coinSpawnTimer = setTimeout(() => {
                if(isGamePlaying) {
                    droppedCoins.push({ x: Math.random() * (canvas.width - 40) + 20, y: Math.random() * (canvas.height - 40) + 20, value: Math.floor(Math.random() * 26) + 1 });
                    scheduleNextCoin();
                }
            }, time);
        }

        function updateGame() {
            if(!isGamePlaying) return;

            // Player di chuyển
            if (moveState.up && player.y - player.radius > 0) player.y -= player.speed;
            if (moveState.down && player.y + player.radius < canvas.height) player.y += player.speed;
            if (moveState.left && player.x - player.radius > 0) player.x -= player.speed;
            if (moveState.right && player.x + player.radius < canvas.width) player.x += player.speed;

            // Logique PvP 2v2 AI Di chuyển nhẹ
            if(isPVPMode) {
                if(pvpTeammate.alive) pvpTeammate.x += (Math.random() - 0.5) * 1.5;
                pvpEnemies.forEach(e => {
                    if(e.alive) { e.x += (Math.random() - 0.5) * 2; e.y += (Math.random() - 0.5) * 1.5; }
                });
            }

            // Ăn Xu
            droppedCoins = droppedCoins.filter(coin => {
                let dx = player.x - coin.x, dy = player.y - coin.y;
                if(Math.sqrt(dx * dx + dy * dy) < player.radius + 10) {
                    userData.money += coin.value; saveData(); updateUI(); return false;
                }
                return true;
            });

            // NPC di chuyển & Va chạm
            npcs.forEach(npc => {
                // Tìm mục tiêu gần nhất giữa các người chơi
                let target = player;
                let minDist = Math.sqrt((player.x - npc.x)**2 + (player.y - npc.y)**2);

                if(isPVPMode) {
                    if(pvpTeammate.alive) {
                        let d = Math.sqrt((pvpTeammate.x - npc.x)**2 + (pvpTeammate.y - npc.y)**2);
                        if(d < minDist) { minDist = d; target = pvpTeammate; }
                    }
                    pvpEnemies.forEach(e => {
                        if(e.alive) {
                            let d = Math.sqrt((e.x - npc.x)**2 + (e.y - npc.y)**2);
                            if(d < minDist) { minDist = d; target = e; }
                        }
                    });
                }

                let dx = target.x - npc.x, dy = target.y - npc.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) { npc.x += (dx / dist) * npc.speed; npc.y += (dy / dist) * npc.speed; }

                // XỬ LÝ CHẾT TRONG PVP 2v2
                if(isPVPMode) {
                    // Check đối thủ bị quái chạm -> Chết
                    pvpEnemies.forEach(e => {
                        if(e.alive && Math.sqrt((e.x - npc.x)**2 + (e.y - npc.y)**2) < e.radius + npc.radius) {
                            e.alive = false;
                        }
                    });
                    // Check đồng đội bị chạm -> Chết
                    if(pvpTeammate.alive && Math.sqrt((pvpTeammate.x - npc.x)**2 + (pvpTeammate.y - npc.y)**2) < pvpTeammate.radius + npc.radius) {
                        pvpTeammate.alive = false;
                    }

                    // Điều kiện Thắng / Thua PvP: Đội nào chết sạch trước thì thua
                    let enemiesDead = pvpEnemies.every(e => !e.alive);
                    let teamDead = (!pvpTeammate.alive) && (dist < player.radius + npc.radius);

                    if(enemiesDead) {
                        userData.money += 30; saveData(); updateUI();
                        stopGameSession('🏆 ĐỘI BẠN CHIẾN THẮNG PVP!', 'Nhận thưởng: +30 Xu');
                        return;
                    }
                }

                // Va chạm Player chính
                if (dist < player.radius + npc.radius) {
                    if (!(ghostInvincible.active && userData.equipped === 'ghost')) {
                        stopGameSession('💀 BẠN ĐÃ CHẾT!', isPVPMode ? 'Đội bạn đã thất bại!' : '');
                        return;
                    }
                }
            });
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Vẽ Xu
            droppedCoins.forEach(coin => {
                ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(coin.x, coin.y, 8, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center'; ctx.fillText('+' + coin.value, coin.x, coin.y + 3);
            });

            // 2. Vẽ Skill Alien
            if (alienShield.active && userData.equipped === 'alien') {
                ctx.beginPath(); ctx.arc(player.x, player.y, alienShield.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 255, 204, 0.25)'; ctx.fill(); ctx.strokeStyle = '#00ffcc'; ctx.stroke();
            }

            // 3. Hiệu ứng Mèo
            if(catSlashEffect > 0) {
                ctx.strokeStyle = '#e94560'; ctx.lineWidth = 3; ctx.beginPath();
                ctx.moveTo(player.x - 30, player.y - 30); ctx.lineTo(player.x + 30, player.y + 30); ctx.stroke(); catSlashEffect--;
            }

            // 4. Vẽ Người Chơi Chính
            ctx.save();
            if (ghostInvincible.active && userData.equipped === 'ghost') ctx.globalAlpha = 0.4;
            ctx.font = '20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            let icons = { human: '🧍', ghost: '👻', alien: '👾', cat: '🐱' };
            ctx.fillText(icons[userData.equipped] || '🧍', player.x, player.y);
            ctx.restore();

            // 5. Vẽ Đồng Đội & Đối Thủ Trong PvP 2v2
            if(isPVPMode) {
                if(pvpTeammate.alive) ctx.fillText(pvpTeammate.icon, pvpTeammate.x, pvpTeammate.y);
                pvpEnemies.forEach(e => {
                    if(e.alive) ctx.fillText(e.icon, e.x, e.y);
                });
            }

            // 6. Vẽ NPC Địch (Quái Đỏ)
            npcs.forEach(npc => {
                ctx.beginPath(); ctx.arc(npc.x, npc.y, npc.radius, 0, Math.PI * 2); ctx.fillStyle = '#ff4757'; ctx.fill();
            });
        }

        let isEngineRunning = false;
        function gameLoop() { updateGame(); drawGame(); requestAnimationFrame(gameLoop); }
        function initGameEngine() { if (!isEngineRunning) { isEngineRunning = true; gameLoop(); } }

        // --- DANH SÁCH PHÒNG PVP CÔNG KHAI ---
        let defaultRooms = ["Phòng Siêu Cấp #1", "Đấu Trường Cyber #2", "Hội Con Ma #3"];
        
        function renderPvPRooms() {
            let container = document.getElementById('pvp-room-list');
            container.innerHTML = "";
            defaultRooms.forEach((room, index) => {
                container.innerHTML += `
                    <div class="item-card">
                        <div class="item-info">
                            <div class="item-title">⚔️ ${room}</div>
                            <div class="item-desc">Chế độ: 2v2 Arena | 🟢 Công khai</div>
                        </div>
                        <button class="btn-primary" style="width: 80px;" onclick="joinPvPRoom('${room}')">VÀO</button>
                    </div>`;
            });
        }

        function createPvPRoom() {
            let roomName = "Phòng của " + currentAccount;
            defaultRooms.unshift(roomName);
            renderPvPRooms();
            joinPvPRoom(roomName);
        }

        // --- CHAT ---
        function sendChat() {
            let inp = document.getElementById('chat-input');
            if(!inp.value.trim()) return;
            let box = document.getElementById('chat-messages');
            box.innerHTML += `<div class="chat-msg"><span class="chat-user">${currentAccount}:</span> ${inp.value}</div>`;
            inp.value = ""; box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
