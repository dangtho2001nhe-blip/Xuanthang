<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Game - Auto Login & Shop & God Mode</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #1a1a1a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #2a2a2a; padding: 25px; border-radius: 12px; width: 360px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        .hidden { display: none !important; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #333; color: #fff; }
        button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 6px; background: #008cba; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #005f73; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .stats-box { background: #333; padding: 10px; border-radius: 8px; margin: 15px 0; text-align: left; }
        .shop-item { border: 1px dashed #555; padding: 10px; margin-top: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- 1. MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="card">
        <h2>ĐĂNG NHẬP GAME</h2>
        <input type="text" id="username" placeholder="Tên tài khoản">
        <input type="password" id="password" placeholder="Mật khẩu">
        
        <div style="text-align: left; margin: 10px 0; font-size: 14px;">
            <label>
                <input type="checkbox" id="remember-me"> Ghi nhớ đăng nhập
            </label>
        </div>

        <button onclick="login()">Vào Game</button>
    </div>

    <!-- 2. MÀN HÌNH CHÍNH GAME -->
    <div id="game-screen" class="card hidden">
        <h2>GAME DASHBOARD</h2>
        
        <div class="stats-box">
            <p>👤 Người chơi: <b id="user-display" style="color: #4db8ff;">-</b></p>
            <p>🪙 Coin: <b id="coin-display" style="color: #ffd700;">10</b></p>
            <p>❤️ Máu (HP): <b id="hp-display" style="color: #ff4d4d;">100</b></p>
            <p>🛡️ Trạng thái: <b id="status-display" style="color: #aaa;">Bình thường</b></p>
        </div>

        <!-- SHOP MUA NHÂN VẬT -->
        <div class="shop-item">
            <h3>🛒 Cửa Hàng</h3>
            <p>Mặt hàng: <b>Nhân vật Bất Tử</b></p>
            <p>Giá: <span style="color: #ffd700; font-weight: bold;">1 Coin</span></p>
            <button id="btn-buy" class="btn-success" onclick="buyGodMode()">Mua Ngay (1 Coin)</button>
        </div>

        <!-- THỬ NGHIỆM TÍNH NĂNG -->
        <div style="margin-top: 15px;">
            <button onclick="takeDamage(20)">💥 Thử Nhận 20 Sát Thương</button>
            <button class="btn-danger" onclick="logout()">Đăng xuất</button>
        </div>
    </div>

    <script>
        // --- DỮ LIỆU TÀI KHOẢN & GAME ---
        let gameState = {
            username: "",
            coins: 10,
            hp: 100,
            isInvincible: false
        };

        // 1. KIỂM TRA ĐĂNG NHẬP TỰ ĐỘNG (GHI NHỚ ĐĂNG NHẬP)
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('game_user') || sessionStorage.getItem('game_user');
            
            if (savedUser) {
                // Tải dữ liệu đã lưu nếu có
                const savedState = localStorage.getItem(`game_data_${savedUser}`);
                if (savedState) {
                    gameState = JSON.parse(savedState);
                } else {
                    gameState.username = savedUser;
                }
                showGameScreen();
            }
        });

        // 2. XỬ LÝ ĐĂNG NHẬP
        function login() {
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;

            if (!usernameInput || !passwordInput) {
                alert("Vui lòng nhập tài khoản và mật khẩu!");
                return;
            }

            gameState.username = usernameInput;

            // Ghi nhớ đăng nhập
            if (rememberMe) {
                localStorage.setItem('game_user', usernameInput);
            } else {
                sessionStorage.setItem('game_user', usernameInput);
            }

            saveGameState();
            showGameScreen();
        }

        // 3. MUA NHÂN VẬT BẤT TỬ VỚI GIÁ 1 COIN
        function buyGodMode() {
            if (gameState.isInvincible) {
                alert("Bạn đã sở hữu Nhân vật Bất Tử rồi!");
                return;
            }

            if (gameState.coins >= 1) {
                gameState.coins -= 1; // Trừ 1 coin
                gameState.isInvincible = true; // Bật tính năng bất tử
                
                saveGameState();
                updateUI();
                alert("🎉 Bạn đã mua thành công Nhân vật Bất Tử với giá 1 Coin!");
            } else {
                alert("Bạn không đủ Coin!");
            }
        }

        // 4. HÀM TÍNH SÁT THƯƠNG (KIỂM TRA BẤT TỬ)
        function takeDamage(amount) {
            if (gameState.isInvincible) {
                alert("🛡️ BẤT TỬ! Nhân vật không bị mất máu.");
                return;
            }

            gameState.hp -= amount;
            if (gameState.hp <= 0) {
                gameState.hp = 0;
                alert("💀 Bạn đã hy sinh! Vui lòng làm mới lại trang.");
            }
            
            updateUI();
        }

        // 5. CẬP NHẬT GIAO DIỆN
        function updateUI() {
            document.getElementById('user-display').innerText = gameState.username;
            document.getElementById('coin-display').innerText = gameState.coins;
            document.getElementById('hp-display').innerText = gameState.hp;

            const statusEl = document.getElementById('status-display');
            const buyBtn = document.getElementById('btn-buy');

            if (gameState.isInvincible) {
                statusEl.innerText = "👑 Đang Bất Tử (God Mode)";
                statusEl.style.color = "#2ecc71";
                buyBtn.innerText = "Đã Sở Hữu";
                buyBtn.disabled = true;
                buyBtn.style.background = "#7f8c8d";
            } else {
                statusEl.innerText = "Bình thường";
                statusEl.style.color = "#aaa";
            }
        }

        // 6. CHUYỂN MÀN HÌNH & LƯU DỮ LIỆU
        function showGameScreen() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            updateUI();
        }

        function saveGameState() {
            if (gameState.username) {
                localStorage.setItem(`game_data_${gameState.username}`, JSON.stringify(gameState));
            }
        }

        // 7. ĐĂNG XUẤT
        function logout() {
            localStorage.removeItem('game_user');
            sessionStorage.removeItem('game_user');
            location.reload(); // Tải lại trang
        }
    </script>
</body>
</html>
