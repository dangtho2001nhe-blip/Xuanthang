<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Cyber Game - Multi-Device, Leaderboard & Audio</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        
        /* HÌNH NỀN PHỦ TOÀN BỘ MÀN HÌNH BÊN NGOÀI */
        body { 
            background-image: url('image.jpeg'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 10px; 
        }
        
        /* CARD DÙNG CHUNG */
        .card { 
            background: rgba(22, 33, 62, 0.95); 
            padding: 15px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            box-shadow: 0 0 20px rgba(0, 255, 245, 0.2); 
            border: 1px solid rgba(0, 255, 245, 0.3); 
            position: relative;
        }

        /* KHUNG ĐĂNG NHẬP TRONG SUỐT NHÌN XUYÊN RA HÌNH NỀN */
        #auth-panel {
            background: rgba(10, 10, 22, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        h2 { color: #00fff5; margin: 0 0 10px 0; font-size: 20px; text-transform: uppercase; text-shadow: 0 0 8px rgba(0,255,245,0.6); }
        
        .nav-bar { display: flex; gap: 4px; margin-bottom: 12px; background: #0f172a; padding: 4px; border-radius: 12px; overflow-x: auto; }
        .nav-btn { flex: 1; padding: 7px 4px; background: none; border: none; color: #8a8a8a; font-size: 11px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; white-space: nowrap; }
        .nav-btn.active { background: #00fff5; color: #0a0a16; box-shadow: 0 0 10px rgba(0, 255, 245, 0.5); }

        .input-group { margin-bottom: 10px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: #a29bfe; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1f4068; background: rgba(15, 23, 42, 0.85); color: #fff; outline: none; }
        
        button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; }
        button:active, button:focus { transform: scale(0.98); outline: 2px solid #00fff5; }
        .btn-primary { background: linear-gradient(45deg, #00fff5, #00a8ff); color: #0a0a16; }
        .btn-success { background: #00b894; color: #fff; }
        .btn-danger { background: #e94560; color: #fff; }
        .btn-warning { background: #fdcb6e; color: #2d3436; }
        .btn-music { background: linear-gradient(45deg, #a29bfe, #6c5ce7); color: #fff; }
        button:disabled { background: #34495e !important; color: #7f8c8d !important; cursor: not-allowed; outline: none !important; }

        .hidden { display: none !important; }
        .money-box { font-size: 13px; font-weight: bold; color: #f1c40f; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        .canvas-container { position: relative; width: 100%; height: 210px; margin-bottom: 8px; }
        canvas { background: #050b14; border-radius: 12px; border: 2px solid #00fff5; width: 100%; height: 100%; display: block; }
        
        .timer-display {
            position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, 0.7); color: #00fff5;
            padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; border: 1px solid #00fff5;
        }

        .game-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.92); border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10;
        }

        .controls-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .dpad { display: grid; grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(3, 38px); gap: 3px; }
        .dpad-btn { background: #0f3460; border: 1px solid #00fff5; color: #fff; font-size: 14px; border-radius: 6px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 3; }
        .action-btns { width: 58%; display: flex; flex-direction: column; gap: 4px; }

        .item-card { background: #0f172a; border: 1px solid #1f4068; padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item-info { text-align: left; }
        .item-title { font-weight: bold; color: #00fff5; font-size: 13px; }
        .item-desc { font-size: 11px; color: #aaa; }
        
        .room-box { background: #0f172a; padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px dashed #00fff5; text-align: center; }

        .chat-box { background: #0f172a; border: 1px solid #1f4068; height: 110px; border-radius: 10px; padding: 8px; overflow-y: auto; text-align: left; font-size: 11px; margin-bottom: 6px; }
        .chat-msg { margin-bottom: 4px; word-break: break-all; }
        .chat-user { color: #00fff5; font-weight: bold; }

        .lb-table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 12px; }
        .lb-table th { background: #0f172a; color: #00fff5; padding: 6px; border-bottom: 2px solid #1f4068; }
        .lb-table td { padding: 6px; border-bottom: 1px solid #1f4068; }

        .guide-text { font-size: 10px; color: #00fff5; margin-top: 3px; opacity: 0.8; }
    </style>
</head>
<body>

    <div id="auth-panel" class="card">
        <h2>CYBER WORLD</h2>
        <div class="input-group">
            <label>Tài Khoản</label>
            <input type="text" id="username" placeholder="Nhập tên...">
        </div>
        <div class="input-group">
            <label>Mật Khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>
        <button class="btn-primary" onclick="login()">ĐĂNG NHẬP</button>
        <button class="btn-success" onclick="register()">ĐĂNG KÝ</button>
    </div>

    </body>
</html>
