<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Online Đa Năng</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; text-align: center; overflow: hidden; }
        
        .screen { display: none; width: 100vw; height: 100vh; flex-direction: column; justify-content: center; align-items: center; position: absolute; top: 0; left: 0; }
        .active { display: flex; }

        input, button { padding: 12px 20px; margin: 8px; font-size: 16px; border-radius: 8px; border: none; outline: none; }
        input { background: #333; color: #fff; border: 1px solid #555; width: 250px; text-align: center; }
        button { background: #4CAF50; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        
        /* Game UI */
        #gameCanvas { background: #222; display: block; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #ui-bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .ui-element { background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; font-weight: bold; }

        /* Shop UI */
        .shop-container { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 600px; }
        .card { background: #2a2a2a; border: 2px solid #444; border-radius: 12px; padding: 15px; width: 160px; display: flex; flex-direction: column; align-items: center; }
        .card h3 { margin-bottom: 10px; color: #ffca28; }

        /* Skill Button */
        #skillBtn { position: absolute; bottom: 20px; right: 20px; width: 70px; height: 70px; border-radius: 50%; background: #ff9800; color: white; font-size: 14px; font-weight: bold; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* Chat UI */
        #chat-box { position: absolute; bottom: 20px; left: 20px; width: 250px; pointer-events: auto; }
        #chat-messages { height: 100px; overflow-y: auto; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 5px; font-size: 12px; text-align: left; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- Màn hình Đăng nhập -->
    <div id="authScreen" class="screen active">
        <h2>🎮 ĐĂNG NHẬP / ĐĂNG KÝ</h2>
        <input type="text" id="username" placeholder="Tên tài khoản...">
        <input type="password" id="password" placeholder="Mật khẩu...">
        <button onclick="login()">Vào Game</button>
    </div>

    <!-- Màn hình Menu / Shop -->
    <div id="menuScreen" class="screen">
        <h2>SẢNH CHỜ</h2>
        <p id="userStats" style="margin: 10px 0; color: #ffd700;"></p>
        
        <div style="margin: 10px 0;">
            <input type="text" id="giftcode" placeholder="Nhập mã Giftcode..." style="width: 180px;">
            <button onclick="claimCode()">Nhận Code</button>
        </div>

        <div class="shop-container">
            <div class="card">
                <h3>Chiến Binh ⚔️</h3>
                <p>Kỹ năng: Bất tử 3s</p>
                <button onclick="selectChar('warrior')">Chọn</button>
            </div>
            <div class="card">
                <h3>Phù Thủy 🪼</h3>
                <p>Kỹ năng: Đẩy NPC ra xa</p>
                <button onclick="selectChar('witch')">Chọn</button>
            </div>
        </div>
        <br>
        <button onclick="startGame()" style="background: #e91e63; font-size: 18px;">VÀO TRẬN 🚀</button>
    </div>

    <!-- Màn hình Game -->
    <div id="gameScreen" class="screen">
        <div id="ui-bar">
            <div class="ui-element" id="coinDisplay">💰 Coin: 0</div>
            <div class="ui-element" id="charDisplay">🎭 NV: Phù thủy 🪼</div>
        </div>

        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <div id="skillBtn" onclick="useSkill()">KỸ NĂNG</div>

        <div id="chat-box">
            <div id="chat-messages"></div>
            <input type="text" id="chatInput" placeholder="Chat..." style="width: 100%; margin:0;" onkeypress="handleChat(event)">
        </div>
    </div>

    <script>
        // State Game
        let userData = { username: "", coins: 0, char: "witch", claimedCodes: [] };
        let canvas = document.getElementById("gameCanvas");
        let ctx = canvas.getContext("2d");
        
        let player = { x: 100, y: 225, radius: 15, speed: 4, isInvincible: false, color: '#e91e63' };
        let npcs = [];
        let keys = {};
        let skillCooldown = false;

        // Xử lý Tài khoản & Giftcode
        function login() {
            let user = document.getElementById("username").value.trim();
            if (!user) return alert("Vui lòng nhập tên!");
            
            let saved = localStorage.getItem("game_user_" + user);
            if (saved) {
                userData = JSON.parse(saved);
            } else {
                userData.username = user;
                saveData();
            }
            showScreen("menuScreen");
            updateMenuUI();
        }

        function saveData() {
            localStorage.setItem("game_user_" + userData.username, JSON.stringify(userData));
        }

        function updateMenuUI() {
            document.getElementById("userStats").innerText = `Tài khoản: ${userData.username} | Số Coin: ${userData.coins}`;
        }

        function claimCode() {
            let code = document.getElementById("giftcode").value.trim();
            if (code === "12345") {
                if (userData.claimedCodes.includes("12345")) {
                    alert("Bạn đã nhập mã này rồi!");
                } else {
                    userData.coins += 132;
                    userData.claimedCodes.push("12345");
                    saveData();
                    updateMenuUI();
                    alert("Nhập mã thành công! Bạn nhận được +132 Coin 🪙");
                    document.getElementById("giftcode").value = "";
                }
            } else {
                alert("Mã quà tặng không hợp lệ!");
            }
        }

        function selectChar(charType) {
            userData.char = charType;
            saveData();
            alert("Đã chọn nhân vật: " + (charType === 'witch' ? "Phù Thủy 🪼" : "Chiến Binh ⚔️"));
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Vào Game
        function startGame() {
            showScreen("gameScreen");
            document.getElementById("charDisplay").innerText = "🎭 NV: " + (userData.char === 'witch' ? "Phù Thủy 🪼" : "Chiến Binh ⚔️");
            document.getElementById("coinDisplay").innerText = "💰 Coin: " + userData.coins;
            
            // Khởi tạo NPC
            npcs = [];
            for(let i = 0; i < 8; i++) {
                npcs.push({
                    x: Math.random() * (canvas.width - 100) + 50,
                    y: Math.random() * (canvas.height - 100) + 50,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    radius: 12
                });
            }

            requestAnimationFrame(gameLoop);
        }

        // Điều khiển Di chuyển
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        function updatePlayer() {
            if (keys['w'] || keys['ArrowUp']) player.y -= player.speed;
            if (keys['s'] || keys['ArrowDown']) player.y += player.speed;
            if (keys['a'] || keys['ArrowLeft']) player.x -= player.speed;
            if (keys['d'] || keys['ArrowRight']) player.x += player.speed;

            // Giới hạn màn hình
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
        }

        // Kỹ năng Phù thủy (Đẩy NPC ra xa) / Chiến Binh (Bất tử)
        function useSkill() {
            if (skillCooldown) return;
            skillCooldown = true;
            document.getElementById("skillBtn").style.opacity = "0.5";

            if (userData.char === 'witch') {
                // Kỹ năng Phù thủy: Đẩy tất cả NPC ra xa khỏi vị trí người chơi
                npcs.forEach(npc => {
                    let dx = npc.x - player.x;
                    let dy = npc.y - player.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist === 0) { dx = 1; dist = 1; } // Tránh chia cho 0
                    
                    // Lực đẩy cực mạnh đẩy NPC ra phía biên màn hình
                    let pushForce = 300; 
                    npc.x += (dx / dist) * pushForce;
                    npc.y += (dy / dist) * pushForce;

                    // Giữ NPC trong khung hình canvas
                    npc.x = Math.max(npc.radius, Math.min(canvas.width - npc.radius, npc.x));
                    npc.y = Math.max(npc.radius, Math.min(canvas.height - npc.radius, npc.y));
                });
            } else {
                // Kỹ năng Chiến binh: Bất tử 3s
                player.isInvincible = true;
                setTimeout(() => { player.isInvincible = false; }, 3000);
            }

            // Cooldown 5s
            setTimeout(() => {
                skillCooldown = false;
                document.getElementById("skillBtn").style.opacity = "1";
            }, 5000);
        }

        // Game Loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            updatePlayer();

            // Vẽ Player
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.isInvincible ? "#00ffff" : (userData.char === 'witch' ? "#9c27b0" : "#e91e63");
            ctx.fill();
            ctx.closePath();

            // Cập nhật & Vẽ NPCs
            npcs.forEach(npc => {
                npc.x += npc.vx;
                npc.y += npc.vy;

                // Nảy tường
                if (npc.x - npc.radius < 0 || npc.x + npc.radius > canvas.width) npc.vx *= -1;
                if (npc.y - npc.radius < 0 || npc.y + npc.radius > canvas.height) npc.vy *= -1;

                ctx.beginPath();
                ctx.arc(npc.x, npc.y, npc.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#ff5722";
                ctx.fill();
                ctx.closePath();
            });

            requestAnimationFrame(gameLoop);
        }

        // Chat
        function handleChat(e) {
            if (e.key === 'Enter') {
                let input = document.getElementById("chatInput");
                if (input.value.trim() !== "") {
                    let msgBox = document.getElementById("chatMessages");
                    let p = document.createElement("div");
                    p.innerText = userData.username + ": " + input.value;
                    msgBox.appendChild(p);
                    msgBox.scrollTop = msgBox.scrollHeight;
                    input.value = "";
                }
            }
        }
    </script>
</body>
</html>
